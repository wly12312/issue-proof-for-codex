name: Codex receipt artifact (manual)

on:
  workflow_dispatch:
    inputs:
      trace_artifact:
        description: "Name of an already uploaded JSONL trace artifact"
        required: true
        type: string
      run_id:
        description: "Workflow run ID that owns the uploaded artifact"
        required: true
        type: string
      report_artifact:
        description: "Optional name of an uploaded baseline report artifact"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  receipt:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.trace_artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: .issue-proof/input-trace
      - name: Locate trace
        id: trace
        shell: pwsh
        run: |
          $traces = @(
            Get-ChildItem -LiteralPath .issue-proof/input-trace -Recurse -File -Filter *.jsonl
          )
          if ($traces.Count -ne 1) {
            throw "Expected exactly one JSONL trace; found $($traces.Count)"
          }
          $trace = $traces[0]
          "path=$($trace.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Download optional baseline
        if: ${{ inputs.report_artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.report_artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: .issue-proof/input-report
      - name: Locate optional baseline
        if: ${{ inputs.report_artifact != '' }}
        id: baseline
        shell: pwsh
        run: |
          $reports = @(
            Get-ChildItem -LiteralPath .issue-proof/input-report -Recurse -File -Filter report.json
          )
          if ($reports.Count -ne 1) {
            throw "Expected exactly one report.json baseline; found $($reports.Count)"
          }
          $report = $reports[0]
          "path=$($report.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Generate draft receipt with baseline
        if: ${{ inputs.report_artifact != '' }}
        env:
          TRACE_PATH: ${{ steps.trace.outputs.path }}
          BASELINE_PATH: ${{ steps.baseline.outputs.path }}
        run: >-
          issue-proof codex receipt
          --trace "$env:TRACE_PATH"
          --baseline "$env:BASELINE_PATH"
          --output .issue-proof/receipt.json
      - name: Generate draft receipt without baseline
        if: ${{ inputs.report_artifact == '' }}
        env:
          TRACE_PATH: ${{ steps.trace.outputs.path }}
        run: >-
          issue-proof codex receipt
          --trace "$env:TRACE_PATH"
          --output .issue-proof/receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-proof-codex-receipt
          path: .issue-proof/receipt.*
          if-no-files-found: error
          include-hidden-files: true
